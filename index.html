<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow - Task Management</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>TaskFlow</h1>
  <p>Plan it. Track it. Finish it.</p>
</header>

<main class="container">
  <section class="stats">
    <div class="stat total"><span id="statTotal">0</span><small>Total</small></div>
    <div class="stat pending"><span id="statPending">0</span><small>Pending</small></div>
    <div class="stat done"><span id="statCompleted">0</span><small>Completed</small></div>
    <div class="stat overdue"><span id="statOverdue">0</span><small>Overdue</small></div>
  </section>

  <section class="panel">
    <h2 id="formTitle">Add New Task</h2>
    <form id="taskForm" novalidate>
      <input type="hidden" id="taskId">
      <div class="field">
        <label for="title">Title *</label>
        <input type="text" id="title" maxlength="60" placeholder="e.g. Finish project report">
      </div>
      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" rows="3" maxlength="300" placeholder="Add some details"></textarea>
      </div>
      <div class="row">
        <div class="field">
          <label for="priority">Priority *</label>
          <select id="priority">
            <option value="High">High</option>
            <option value="Medium" selected>Medium</option>
            <option value="Low">Low</option>
          </select>
        </div>
        <div class="field">
          <label for="dueDate">Due Date *</label>
          <input type="date" id="dueDate">
        </div>
      </div>
      <p id="formError" class="error"></p>
      <div class="actions">
        <button type="submit" id="saveBtn" class="btn primary">Add Task</button>
        <button type="button" id="cancelBtn" class="btn ghost hidden">Cancel Edit</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <h2>Your Tasks</h2>
    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="Search by title or description">
      <select id="statusFilter">
        <option value="all">All Status</option>
        <option value="pending">Pending</option>
        <option value="completed">Completed</option>
        <option value="overdue">Overdue</option>
      </select>
      <select id="priorityFilter">
        <option value="all">All Priorities</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select>
      <select id="sortSelect">
        <option value="created-desc">Newest First</option>
        <option value="created-asc">Oldest First</option>
        <option value="due-asc">Due Date (Earliest)</option>
        <option value="due-desc">Due Date (Latest)</option>
        <option value="priority-desc">Priority (High to Low)</option>
        <option value="priority-asc">Priority (Low to High)</option>
        <option value="title-asc">Title (A to Z)</option>
      </select>
    </div>
    <ul id="taskList" class="task-list"></ul>
    <p id="emptyState" class="empty hidden"></p>
  </section>
</main>

<footer class="footer">TaskFlow &copy; 2026</footer>
<script src="script.js"></script>
</body>
</html>
